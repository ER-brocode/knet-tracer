[package]
name = "knet-tracer"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Distributed eBPF Observability & Kernel Network Telemetry Engine"
license = "Apache-2.0"

[dependencies]
aya = { version = "0.12", optional = true }
aya-log = { version = "0.2", optional = true }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
